services:
  - type: web
    name: workpulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: workpulse-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: WorkPulseApi
      - key: Jwt__Audience
        value: WorkPulseApp
      - key: AllowedOrigins__0
        value: https://workpulse-api-mbco.onrender.com
      - key: AllowedOrigins__1
        value: https://work-pulse-ruddy.vercel.app
      - key: FrontendBaseUrl
        value: https://work-pulse-ruddy.vercel.app
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Google__RedirectUri
        value: https://workpulse-api-mbco.onrender.com/api/googledrive/callback
      - key: Gmail__RedirectUri
        value: https://workpulse-api-mbco.onrender.com/api/gmail/callback
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__User
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__From
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: workpulse-db
    plan: free
    databaseName: workpulse
    user: workpulse_user
