version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nist_attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5100:10000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nist_attendance;Username=postgres;Password=postgres
      - Jwt__Secret=NistAttendanceDevelopmentSecretKey2026!MinLength32Chars
      - Jwt__Issuer=NistAttendanceApi
      - Jwt__Audience=NistAttendanceApp
      - AllowedOrigins__0=http://localhost:5100
      - AllowedOrigins__1=http://localhost:5200
    depends_on:
      - db

volumes:
  pgdata:
