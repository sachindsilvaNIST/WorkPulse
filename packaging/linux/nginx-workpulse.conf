# Reverse proxy for WorkPulse.Api (which also serves the Blazor web app).
# Copy to /etc/nginx/sites-available/workpulse, symlink into sites-enabled, then
# run certbot (see README) to fill in the TLS block automatically.
#
#   sudo cp nginx-workpulse.conf /etc/nginx/sites-available/workpulse
#   sudo ln -s /etc/nginx/sites-available/workpulse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain-or-ip;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
