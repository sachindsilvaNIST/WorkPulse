<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkPulse</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WorkPulse.Web.styles.css" rel="stylesheet" />

    <!-- Markdown Editor: CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/dracula.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-palenight.min.css" />
    <!-- Markdown Editor: highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <!-- Markdown Editor: JS libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/mode/overlay.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/gfm/gfm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/shell/shell.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/continuelist.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/display/placeholder.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="js/notes-editor.js"></script>
    <script src="js/file-download.js"></script>

    <!-- Theme + Dictionary helpers -->
    <script>
        // Apply saved theme immediately (before Blazor loads) to prevent flash
        (function() {
            var t = localStorage.getItem('nist-theme');
            if (t === 'Dark') document.documentElement.classList.add('dark');

            var accent = localStorage.getItem('nist-accent');
            if (accent) document.documentElement.style.setProperty('--color-nist-primary', accent);
        })();

        function setAccent(hex) {
            document.documentElement.style.setProperty('--color-nist-primary', hex);
            localStorage.setItem('nist-accent', hex);
        }

        function getAccent() {
            return localStorage.getItem('nist-accent') || '#0078D4';
        }

        function resetAccent() {
            document.documentElement.style.removeProperty('--color-nist-primary');
            localStorage.removeItem('nist-accent');
        }

        function setTheme(theme) {
            if (theme === 'Dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            localStorage.setItem('nist-theme', theme);
        }

        function getTheme() {
            return localStorage.getItem('nist-theme') || 'Light';
        }

        // Global Ctrl+K / Cmd+K command palette trigger
        window.registerCommandPalette = function(dotnetRef) {
            document.addEventListener('keydown', function(e) {
                var tag = (e.target && e.target.tagName) || '';
                var isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);

                // Ctrl+K / Cmd+K -> palette (always works, even inside inputs)
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    dotnetRef.invokeMethodAsync('TogglePalette');
                    return;
                }

                // Escape -> close topmost modal overlay
                if (e.key === 'Escape' && !isTyping) {
                    var overlays = document.querySelectorAll('.modal-overlay');
                    if (overlays.length > 0) {
                        var top = overlays[overlays.length - 1];
                        var closeBtn = top.querySelector('[data-modal-close], .modal-header button');
                        if (closeBtn) { closeBtn.click(); e.preventDefault(); }
                    }
                    return;
                }

                // Skip further shortcuts while typing
                if (isTyping) return;

                // "/" -> focus first visible search input
                if (e.key === '/') {
                    var inputs = document.querySelectorAll('input[type="text"], input[type="search"]');
                    for (var i = 0; i < inputs.length; i++) {
                        var el = inputs[i];
                        var ph = (el.getAttribute('placeholder') || '').toLowerCase();
                        if (ph.indexOf('search') !== -1 && el.offsetParent !== null) {
                            e.preventDefault();
                            el.focus();
                            return;
                        }
                    }
                }
            });
        };

        function dictNotesGetSelection(id) {
            var el = document.getElementById(id);
            if (!el) return [0, 0];
            return [el.selectionStart, el.selectionEnd];
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window) || !text) return false;
            try {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.lang = lang || 'ja-JP';
                u.rate = 0.9;
                u.pitch = 1.0;
                var voices = window.speechSynthesis.getVoices();
                var match = voices.find(function (v) { return v.lang === u.lang; })
                         || voices.find(function (v) { return v.lang && v.lang.indexOf(u.lang.split('-')[0]) === 0; });
                if (match) u.voice = match;
                window.speechSynthesis.speak(u);
                return true;
            } catch (e) { return false; }
        }
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
